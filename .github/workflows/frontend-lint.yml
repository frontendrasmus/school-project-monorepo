name: Frontend Checks

on:
  push:
    branches:
      - main
      - inital-poc-setup-frontend-next
      - '**' # This will run on all branches
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - '.github/workflows/**' # Added to trigger on workflow changes
  pull_request:
    branches:
      - main
      - inital-poc-setup-frontend-next
      - '**' # This will run on all branches
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - '.github/workflows/**' # Added to trigger on workflow changes
  workflow_dispatch: # Allows manual triggering

jobs:
  code-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ensure Prisma client is generated before build
      - name: Generate Prisma Client
        run: pnpm --filter ./apps/frontend exec prisma generate

      # Step 1: Prettier formatting check
      - name: Check formatting
        id: format
        run: pnpm exec prettier --check .
        continue-on-error: true

      - name: Run type checking
        id: typecheck
        run: |
          pnpm run typecheck
        continue-on-error: true

      - name: Run linting
        id: lint
        run: |
          pnpm run lint
        continue-on-error: true

      # Step 3: Production build with caching and tsc-alias
      - name: Restore Next.js cache
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/pnpm-lock.yaml', '**/next.config.js') }}

      - name: Build project
        id: build
        run: pnpm run build
        continue-on-error: true

      - name: Run tsc-alias to fix path aliases
        id: tscalias
        run: pnpm dlx tsc-alias -p apps/frontend/tsconfig.json
        continue-on-error: true

      - name: Upload code quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-results
          path: |
            apps/frontend/.eslintcache
            apps/frontend/tsconfig.tsbuildinfo
          if-no-files-found: warn

      - name: Check for errors
        if: always()
        run: |
          failures=""
          [[ "${{ steps.format.outcome }}" == "failure" ]] && failures+=" formatting"
          [[ "${{ steps.typecheck.outcome }}" == "failure" ]] && failures+=" typecheck"
          [[ "${{ steps.lint.outcome }}" == "failure" ]] && failures+=" lint"
          [[ "${{ steps.build.outcome }}" == "failure" ]] && failures+=" build"
          [[ "${{ steps.tscalias.outcome }}" == "failure" ]] && failures+=" tsc-alias"

          if [ -n "$failures" ]; then
            echo "❌ The following checks failed:$failures"
            # Add a markdown summary for the Actions page
            echo "### Failed checks" >> $GITHUB_STEP_SUMMARY
            for f in $failures; do
              echo "- $f" >> $GITHUB_STEP_SUMMARY
            done
            exit 1
          else
            echo "✅ All code-quality checks passed!"
          fi
