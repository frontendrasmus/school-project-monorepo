version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_parent_db
    environment:
      POSTGRES_USER: school_parent
      POSTGRES_PASSWORD: school_parent_password
      POSTGRES_DB: school_parent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U school_parent']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
